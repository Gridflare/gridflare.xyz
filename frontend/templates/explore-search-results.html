{% extends 'base.html' %}
{% block content %}
    <div class='pane xoverflow mw20em'>
        <h2>Search Results</h2>

        <table>
            <tr>
                <th>Alias</th>
                <th>Pub Key</th>
            </tr>
            {% for n in results %}
            <tr>
                <td>{{n['alias']}}</td>
                <td><a href='/explore/node/{{n["pub_key"]}}'>
                    {{n['pub_key']}}</a></td>
            </tr>
            {% endfor %}
        </table>
        {% if results|length  > 0 %}
        <form method='get' style='float:right;'>
            <input type='hidden' value='{{ q }}' name='q'>
            <input type='hidden' value='{{ p + 1 }}' name='p'>
            <input type='submit' value='Next'>
        </form>
        {% else %}
        <p>No results. Search is a work in progress.</p>
        {% endif %}
        {% if p > 1 %}
        <form method='get' style='float:left;'>
            <input type='hidden' value='{{ q }}' name='q'>
            <input type='hidden' value='{{ p - 1 }}' name='p'>
            <input type='submit' value='Prev'>
        </form>
        {% endif %}
    </div>
{% endblock %}
