{% extends 'base.html' %}
{% block content %}
    <div class='pane mw40em'>
        <h1>Search</h1>
        <form method='get'>
            <input type='text' placeholder='pubkey or alias' name='q' class='w95'>
            <br>
            <input type='submit' value='Search'>
            <input type='submit' value='Random Node' formaction='/explore/randomnode'>
        </form>
    </div>
    <div class='pane'>
        <h2>Known Nodes</h2>
        <p>{{graphstats['num_nodes']}}</p>
    </div>
    <div class='pane'>
        <h2>Known Channels</h2>
        <p>{{graphstats['num_chans']}}</p>
    </div>
    <div class='pane'>
        <h2>Last Update</h2>
        <p>
            {{graphstats['last_update'] | dtime }} ago
        </p>
    </div>
{% endblock %}
